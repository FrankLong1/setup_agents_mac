---
# Mac Environment Setup Playbook
# Run: cd ansible && ./run.sh
# Review: Edit group_vars/all.yml to toggle what gets installed
#
# Run individual roles with tags:
#   ./run.sh prerequisites
#   ./run.sh homebrew
#   ./run.sh mas
#   ./run.sh dotfiles
#   ./run.sh vscode
#   ./run.sh npm
#   ./run.sh go
#   ./run.sh macos
#   ./run.sh backup

- name: Setup Mac environment
  hosts: localhost
  connection: local

  roles:
    - { role: prerequisites, tags: ['prerequisites'] }
    - { role: homebrew,      tags: ['homebrew'] }
    - { role: mas_apps,      tags: ['mas'] }
    - { role: dotfiles,      tags: ['dotfiles'] }
    - { role: vscode,        tags: ['vscode'] }
    - { role: npm_globals,   tags: ['npm'] }
    - { role: go_tools,      tags: ['go'] }
    - { role: macos_defaults, tags: ['macos'] }
    - { role: backup,        tags: ['backup', 'never'] }

  post_tasks:
    - name: Manual install reminders
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════╗
          ║              MANUAL INSTALL APPS                        ║
          ╚══════════════════════════════════════════════════════════╝
          {% for app in manual_install_apps %}
          • {{ app.name }} — {{ app.url }}
          {% endfor %}
      tags: ['always']

    - name: Post-install manual steps
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════╗
          ║              POST-INSTALL CHECKLIST                     ║
          ╚══════════════════════════════════════════════════════════╝
          1. gh auth login
          2. gcloud auth login
          3. aws configure
          4. claude login
          5. vercel login
          6. Restore SSH keys from backup
          7. Restore Obsidian vault from backup/sync
          8. Restore Warp launch configs
          9. Sign in to apps (Chrome, Spotify, Signal, WhatsApp, Zoom)
          10. Grant Terminal "Full Disk Access" in System Settings > Privacy & Security
          11. Enable "Remote Login" in System Settings > Sharing (if needed)
      tags: ['always']

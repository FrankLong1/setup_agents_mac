---
# Backup role — run BEFORE wiping your machine
# Usage: ansible-playbook site.yml --tags backup

- name: Create backup directory
  file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0700"

- name: Generate Brewfile (full app list)
  shell: brew bundle dump --file={{ backup_dir }}/Brewfile --force
  changed_when: false

- name: List Mac App Store apps
  shell: mas list > {{ backup_dir }}/mas_apps.txt
  failed_when: false
  changed_when: false

- name: List VS Code extensions
  shell: code --list-extensions > {{ backup_dir }}/vscode_extensions.txt
  failed_when: false
  changed_when: false

- name: List global npm packages
  shell: npm list -g --depth=0 > {{ backup_dir }}/npm_globals.txt
  failed_when: false
  changed_when: false

- name: Back up enabled items
  synchronize:
    src: "{{ item.src }}/"
    dest: "{{ backup_dir }}/{{ item.name }}/"
    recursive: true
  loop: "{{ backup_items }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Capture API keys/secrets references (not values)
  shell: |
    grep -r "API_KEY\|SECRET\|TOKEN\|ANTHROPIC\|OPENAI" \
      {{ ansible_env.HOME }}/.zshrc \
      {{ ansible_env.HOME }}/.bashrc \
      {{ ansible_env.HOME }}/.bash_profile \
      {{ ansible_env.HOME }}/.zprofile 2>/dev/null \
    | sed 's/=.*/=<REDACTED>/' > {{ backup_dir }}/env_var_names.txt
  failed_when: false
  changed_when: false

- name: Backup summary
  debug:
    msg: |
      ╔══════════════════════════════════════════════════════════╗
      ║                 BACKUP COMPLETE                         ║
      ╚══════════════════════════════════════════════════════════╝
      Location: {{ backup_dir }}
      Contents:
        • Brewfile (all brew packages + casks)
        • mas_apps.txt (App Store apps)
        • vscode_extensions.txt
        • npm_globals.txt
        • env_var_names.txt (variable names only, values redacted)
        {% for item in backup_items %}
        • {{ item.name }}/ (from {{ item.src }})
        {% endfor %}

      NEXT: Copy {{ backup_dir }} to external drive or cloud storage.
      DO NOT store unencrypted SSH keys in cloud — use an encrypted archive.

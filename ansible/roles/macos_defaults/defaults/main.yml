---
# macOS system preferences
macos_defaults:
  # Dock
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    description: "Auto-hide the Dock"
  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 74
    description: "Dock icon size (pixels)"
  - domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
    description: "Hide recent apps in Dock"

  # Finder
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    description: "Show all file extensions"
  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv
    description: "Finder default view: list"
  - domain: com.apple.finder
    key: FXPreferredGroupBy
    type: string
    value: Kind
    description: "Finder group by: Kind"
  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfAF
    description: "New Finder windows open All Files"

  # Keyboard
  - domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2
    description: "Key repeat rate (lower=faster)"
  - domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15
    description: "Delay until key repeat (lower=shorter)"
  - domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
    description: "Disable press-and-hold for accented chars (enable key repeat)"
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false
    description: "Disable auto-capitalization"
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false
    description: "Disable double-space period substitution"

# Dock app order
dock_apps:
  - "/Applications/ChatGPT Atlas.app"
  - "/Applications/Google Chrome.app"
  - "/System/Applications/Messages.app"
  - "/System/Applications/Notes.app"
  - "/System/Applications/iPhone Mirroring.app"
  - "/System/Applications/System Settings.app"
  - "/System/Applications/Voice Memos.app"
  - "/Applications/Obsidian.app"
  - "/Applications/Cursor.app"

---
# User identity
git_user_name: "Frank Long"
git_user_email: "fylong00@gmail.com"

# Shell aliases
shell_aliases:
  - alias: claude_yolo
    command: "claude --dangerously-skip-permissions"
  - alias: gemini_yolo
    command: "gemini --yolo"

# Extra PATH entries
extra_path_entries:
  - "$HOME/.local/bin"
  - "$HOME/.bun/bin"
  - "$HOME/bin"
  - "$HOME/go/bin"

# Shell completions & extras
shell_extras:
  - name: bun_completions
    line: '[ -s "$HOME/.bun/_bun" ] && source "$HOME/.bun/_bun"'
  - name: bun_env
    lines:
      - 'export BUN_INSTALL="$HOME/.bun"'
      - 'export PATH="$BUN_INSTALL/bin:$PATH"'

# Claude Code settings
claude_settings:
  voice_enabled: true
  skip_dangerous_mode_prompt: true
  experimental_agent_teams: true

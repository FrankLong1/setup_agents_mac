# Window numbering
set -g base-index 1
set -g pane-base-index 1

# Dual prefix keys (Ctrl-b default + backtick for easier reach)
set -g prefix2 `
bind ` send-prefix -2

# Status bar styling (overridden per-session by launch scripts)
set -g status-style "bg=black,fg=white"
set -g status-position bottom
set -g status-left-length 50
set -g status-right-length 50

# Window styling (active window gets dark grey bg per-session)
set -g window-status-style "bg=default,fg=white"
set -g window-status-format " #I #W "
set -g window-status-current-style "bg=colour238,fg=white,bold"
set -g window-status-current-format " #I #W "

# Mouse support
set -g mouse on

# Pane borders (subtle, same color for active/inactive)
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour240"

# Pane titles (active pane gets yellow highlight)
set -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[bg=colour228]#[fg=black]#[bold] #{pane_title} ,#[fg=colour240] #{pane_title} }"

# Vi mode and modern clipboard (tmux 2.6+)
set -g set-clipboard off
setw -g mode-keys vi

# Vi-style copy bindings with system clipboard integration
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" \; display-message -d 1500 -F "Copied #{buffer_sample[40]}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy" \; display-message -d 1500 -F "Copied #{buffer_sample[40]}"

# Paste from system clipboard
unbind p
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer && tmux display-message -d 1500 -F 'Pasted #{buffer_sample[40]}'"

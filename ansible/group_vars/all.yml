  - name: git
  - name: node
  - name: "python@3.13"
  - name: uv
  - name: ripgrep
  - name: gh
  - name: wget
  - name: tmux
  - name: bash

  # Languages & runtimes
  - name: go

  # Cloud & infra
  - name: awscli

  # Containers
  - name: docker
  - name: docker-compose
  - name: colima

  # Media
  - name: ffmpeg
  - name: imagemagick

  # Misc utilities
  - name: yq
  - name: graphviz

  # AI tools
  - name: gemini-cli

# --- Desktop Apps (Homebrew casks) ---
homebrew_casks:
  # Code editors & terminals
  - name: cursor
  - name: visual-studio-code

  # Productivity & writing
  - name: obsidian

  # Communication
  - name: zoom
  - name: signal
  - name: whatsapp

  # Browsers
  - name: google-chrome

  # Cloud
  - name: gcloud-cli
  - name: ngrok/ngrok/ngrok
  - name: google-drive

  # Media & misc
  - name: spotify
  - name: flux-app

  # AI desktop apps
  - name: claude
  - name: raycast
  - name: codex-app
  - name: wispr-flow
  - name: duet
  - name: conductor

# --- Mac App Store apps (requires `mas`) ---
# Find app IDs: `mas search <app name>`
mas_apps:
  - name: Magnet
    id: 441258766
  - name: "Amazon Kindle"
    id: 302584613

# --- Global npm packages ---
npm_global_packages:
  - name: "@anthropic-ai/claude-code"
  - name: ccusage
  - name: vercel
  - name: "@modelcontextprotocol/server-puppeteer"

# --- VS Code Extensions ---
vscode_extensions:
  # AI assistants
  - name: anthropic.claude-code
  - name: github.copilot-chat

  # Python
  - name: ms-python.python
  - name: ms-python.vscode-pylance
  - name: ms-python.debugpy

  # Jupyter
  - name: ms-toolsai.jupyter
  - name: ms-toolsai.jupyter-keymap
  - name: ms-toolsai.jupyter-renderers

  # Go
  - name: golang.go

  # Remote / containers
  - name: ms-vscode-remote.remote-ssh
  - name: ms-vscode-remote.remote-containers

  # Docker
  - name: ms-azuretools.vscode-docker

  # Cloud
  - name: amazonwebservices.aws-toolkit-vscode
  - name: hashicorp.terraform

  # Utilities
  - name: gruntfuggly.todo-tree
  - name: vscode-icons-team.vscode-icons
  - name: mechatroner.rainbow-csv
  - name: shd101wyy.markdown-preview-enhanced

# --- macOS System Preferences ---
macos_defaults:
  # Dock
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    description: "Auto-hide the Dock"
  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 74
    description: "Dock icon size (pixels)"
  - domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
    description: "Hide recent apps in Dock"

  # Finder
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
    description: "Show all file extensions"
  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv
    description: "Finder default view: list"
  - domain: com.apple.finder
    key: FXPreferredGroupBy
    type: string
    value: Kind
    description: "Finder group by: Kind"
  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: PfAF
    description: "New Finder windows open All Files"

  # Keyboard
  - domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2
    description: "Key repeat rate (lower=faster)"
  - domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15
    description: "Delay until key repeat (lower=shorter)"
  - domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
    description: "Disable press-and-hold for accented chars (enable key repeat)"
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false
    description: "Disable auto-capitalization"
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: false
    description: "Disable double-space period substitution"

# --- Go tools (installed via `go install`) ---
go_tools:
  - name: github.com/go-delve/delve/cmd/dlv@latest
    description: "Go debugger"
  - name: golang.org/x/tools/cmd/goimports@latest
    description: "Auto-manage imports"
  - name: github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    description: "Go linter aggregator"
  - name: golang.org/x/tools/gopls@latest
    description: "Go language server"
  - name: honnef.co/go/tools/cmd/staticcheck@latest
    description: "Go static analyzer"

# --- Dock app order (applied by macos_defaults role) ---
dock_apps:
  - "/Applications/ChatGPT Atlas.app"
  - "/Applications/Google Chrome.app"
  - "/System/Applications/Messages.app"
  - "/System/Applications/Notes.app"
  - "/System/Applications/iPhone Mirroring.app"
  - "/System/Applications/System Settings.app"
  - "/System/Applications/Voice Memos.app"
  - "/Applications/Obsidian.app"
  - "/Applications/Cursor.app"

# --- Shell aliases ---
shell_aliases:
  - alias: claude_yolo
    command: "claude --dangerously-skip-permissions"
  - alias: gemini_yolo
    command: "gemini --yolo"

# --- Extra PATH entries ---
extra_path_entries:
  - "$HOME/.local/bin"
  - "$HOME/.bun/bin"
  - "$HOME/bin"
  - "$HOME/go/bin"

# --- Shell completions & extras ---
shell_extras:
  - name: bun_completions
    line: '[ -s "$HOME/.bun/_bun" ] && source "$HOME/.bun/_bun"'
  - name: bun_env
    lines:
      - 'export BUN_INSTALL="$HOME/.bun"'
      - 'export PATH="$BUN_INSTALL/bin:$PATH"'

# --- Claude Code settings ---
claude_settings:
  voice_enabled: true
  skip_dangerous_mode_prompt: true
  experimental_agent_teams: true

# --- Backup settings (used by backup role) ---
backup_dir: "{{ ansible_env.HOME }}/mac_backup"
backup_items:
  - name: ssh_keys
    src: "{{ ansible_env.HOME }}/.ssh"
  - name: fonts
    src: "{{ ansible_env.HOME }}/Library/Fonts"

# --- Manual install apps (not in Homebrew or App Store) ---
manual_install_apps:
  - name: "We Love Lights"
    url: "manual download"
  - name: "FastestVPN"
    url: "App Store or website"

# --- macOS System Preferences ---
macos_defaults:
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    enabled: true
    description: "Auto-hide the Dock"
  - domain: com.apple.dock
    key: tilesize
    type: int
    value: 74
    enabled: true
    description: "Dock icon size (pixels)"

# --- Shell aliases ---
shell_aliases:
  - alias: claude_yolo
    command: "claude --dangerously-skip-permissions"
    enabled: true
  - alias: claude_auto
    command: "claude --dangerously-skip-permissions"
    enabled: true
  - alias: gemini_yolo
    command: "gemini --yolo"
    enabled: true
  - alias: gemini_auto
    command: "gemini --yolo"
    enabled: true

# --- Extra PATH entries ---
extra_path_entries:
  - "$HOME/.local/bin"
  - "$HOME/.bun/bin"
  - "$HOME/bin"

# --- Claude Code settings ---
claude_settings:
  voice_enabled: true
  skip_dangerous_mode_prompt: true
  experimental_agent_teams: true

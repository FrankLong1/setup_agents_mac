git_user_email: "fylong00@gmail.com"

# --- Homebrew Taps ---
homebrew_taps:
  - name: ngrok/ngrok

# --- Helper Utilities (installed first, used by other roles) ---
helper_formulae:
  - name: mas                       # Mac App Store CLI — required for mas_apps role
  - name: ansible-lint              # Lint your playbooks
  - name: tree                      # Visualize directory structure


# ============================================================
# MAC SETUP CONFIG
# ============================================================
# Essentials only — everything else is a `brew install` away.
# Nice-to-haves are listed in comments at the bottom.
# ============================================================

# --- User identity ---
git_user_name: "Frank Long"
git_user_email: "fylong00@gmail.com"

# --- Helper Utilities (installed first, used by other roles) ---
helper_formulae:
  - name: mas                       # Mac App Store CLI — required for mas_apps role
  - name: ansible-lint
  - name: tree

# --- Core CLI Tools (Homebrew formulae) ---
homebrew_taps: []

homebrew_formulae:
  - name: git
  - name: node
  - name: "python@3.13"
  - name: uv
  - name: ripgrep
  - name: gh
  - name: tmux
  - name: bash
  - name: go
  - name: awscli
  - name: gemini-cli
  - name: wget
  - name: yq
  - name: docker

# --- Desktop Apps (Homebrew casks) ---
homebrew_casks:
  - name: cursor
  - name: visual-studio-code
  - name: obsidian
  - name: google-chrome
  - name: zoom
  - name: signal
  - name: whatsapp
  - name: spotify
  - name: google-drive
  - name: claude
  - name: raycast
  - name: wispr-flow
  - name: codex-app
  - name: duet
  - name: conductor
  - name: flux-app

# --- Mac App Store apps ---
mas_apps:
  - name: Magnet
    id: 441258766
  - name: "Amazon Kindle"
    id: 302584613

# --- Global npm packages ---
npm_global_packages:
  - name: "@anthropic-ai/claude-code"
  - name: ccusage
  - name: vercel
  - name: "@modelcontextprotocol/server-puppeteer"

# --- VS Code Extensions ---
vscode_extensions:
  # Python
  - name: ms-python.python
  - name: ms-python.vscode-pylance
  - name: ms-python.debugpy
  # Jupyter
  - name: ms-toolsai.jupyter
  - name: ms-toolsai.jupyter-keymap
  - name: ms-toolsai.jupyter-renderers
  # Go
  - name: golang.go
  # Remote / containers
  - name: ms-vscode-remote.remote-ssh
  - name: ms-vscode-remote.remote-containers
  # Cloud
  - name: hashicorp.terraform

# --- macOS System Preferences ---
macos_defaults:
  # Dock
  - { domain: com.apple.dock, key: autohide, type: bool, value: true, description: "Auto-hide the Dock" }
  - { domain: com.apple.dock, key: tilesize, type: int, value: 74, description: "Dock icon size (pixels)" }
  - { domain: com.apple.dock, key: show-recents, type: bool, value: false, description: "Hide recent apps in Dock" }
  # Finder
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: true, description: "Show all file extensions" }
  - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: Nlsv, description: "Finder default view: list" }
  - { domain: com.apple.finder, key: FXPreferredGroupBy, type: string, value: Kind, description: "Finder group by: Kind" }
  - { domain: com.apple.finder, key: NewWindowTarget, type: string, value: PfAF, description: "New Finder windows open All Files" }
  # Keyboard
  - { domain: NSGlobalDomain, key: KeyRepeat, type: int, value: 2, description: "Key repeat rate (lower=faster)" }
  - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: int, value: 15, description: "Delay until key repeat (lower=shorter)" }
  - { domain: NSGlobalDomain, key: ApplePressAndHoldEnabled, type: bool, value: false, description: "Disable press-and-hold (enable key repeat)" }
  - { domain: NSGlobalDomain, key: NSAutomaticCapitalizationEnabled, type: bool, value: false, description: "Disable auto-capitalization" }
  - { domain: NSGlobalDomain, key: NSAutomaticPeriodSubstitutionEnabled, type: bool, value: false, description: "Disable double-space period" }

# --- Go tools (installed via `go install`) ---
go_tools:
  - { name: "github.com/go-delve/delve/cmd/dlv@latest", description: "Go debugger" }
  - { name: "golang.org/x/tools/cmd/goimports@latest", description: "Auto-manage imports" }
  - { name: "github.com/golangci/golangci-lint/cmd/golangci-lint@latest", description: "Go linter aggregator" }
  - { name: "golang.org/x/tools/gopls@latest", description: "Go language server" }
  - { name: "honnef.co/go/tools/cmd/staticcheck@latest", description: "Go static analyzer" }

# --- Dock app order ---
dock_apps:
  - "/Applications/Google Chrome.app"
  - "/System/Applications/Messages.app"
  - "/System/Applications/Notes.app"
  - "/System/Applications/System Settings.app"
  - "/Applications/Cursor.app"

# --- Shell ---
shell_aliases:
  - { alias: claude_yolo, command: "claude --dangerously-skip-permissions" }
  - { alias: gemini_yolo, command: "gemini --yolo" }

extra_path_entries:
  - "$HOME/.local/bin"
  - "$HOME/.bun/bin"
  - "$HOME/bin"
  - "$HOME/go/bin"

shell_extras:
  - name: bun_completions
    line: '[ -s "$HOME/.bun/_bun" ] && source "$HOME/.bun/_bun"'
  - name: bun_env
    lines:
      - 'export BUN_INSTALL="$HOME/.bun"'
      - 'export PATH="$BUN_INSTALL/bin:$PATH"'

# --- Claude Code settings ---
claude_settings:
  voice_enabled: true
  skip_dangerous_mode_prompt: true
  experimental_agent_teams: true

# --- Backup settings ---
backup_dir: "{{ ansible_env.HOME }}/mac_backup"
backup_items:
  - { name: ssh_keys, src: "{{ ansible_env.HOME }}/.ssh" }
  - { name: fonts, src: "{{ ansible_env.HOME }}/Library/Fonts" }

# --- Manual install apps ---
manual_install_apps:
  - { name: "We Love Lights", url: "manual download" }
  - { name: "FastestVPN", url: "App Store or website" }

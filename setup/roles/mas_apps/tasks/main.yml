---
# Mac App Store apps — requires `mas` CLI (installed by prerequisites role)

- name: Check if mas is installed
  shell: command -v mas
  register: mas_check
  failed_when: false
  changed_when: false

- name: Check if signed in to App Store
  shell: mas account
  register: mas_account
  failed_when: false
  changed_when: false
  when: mas_check.rc == 0

- name: Warn if not signed in to App Store
  debug:
    msg: "WARNING: Not signed in to Mac App Store. Sign in manually, then re-run with --tags mas"
  when: mas_check.rc == 0 and mas_account.rc != 0

- name: Install Mac App Store apps
  shell: "mas install {{ item.id }}"
  loop: "{{ mas_apps }}"
  loop_control:
    label: "{{ item.name }} ({{ item.id }})"
  register: mas_result
  failed_when: false
  changed_when: "'already installed' not in mas_result.stdout | default('')"
  when: mas_check.rc == 0 and mas_account.rc == 0
